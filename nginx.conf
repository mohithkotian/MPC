server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend — same origin, no CORS, no cookie issues
    location /api/ {
        proxy_pass https://mpc-backend-latest.onrender.com;
        proxy_http_version 1.1;

        proxy_set_header Host mpc-backend-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies (both directions)
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;

        # Allow credentials (cookies) through
        proxy_pass_request_headers on;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
