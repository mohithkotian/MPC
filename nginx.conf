server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver — prevents stale IP cache when Render/Cloudflare rotates IPs
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    # --- Security headers (applied to every response from this server) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self' https://mpc-backend-latest.onrender.com" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy all /api/* requests to the backend — same origin, no CORS, no cookie issues
    location /api/ {
        proxy_pass https://mpc-backend-latest.onrender.com;
        proxy_http_version 1.1;

        # Required for Cloudflare-fronted backends: sends SNI on the upstream TLS handshake
        proxy_ssl_server_name on;

        proxy_set_header Host mpc-backend-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies (both directions)
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;

        # Allow credentials (cookies) through
        proxy_pass_request_headers on;

        # API responses shouldn't be cached (esp. auth endpoints)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # index.html should always be revalidated, not cached, so deploys show up immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Cache static assets (hashed filenames — safe to cache forever, unaffected by the no-cache rule above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}