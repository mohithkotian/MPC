server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the configured backend.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;

        # Required for HTTPS backends such as Render; harmless for local HTTP.
        proxy_ssl_server_name on;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward request headers, including the caller's Supabase Bearer token.
        proxy_pass_request_headers on;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA fallback — all non-file routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Cache static assets (hashed filenames are safe to cache).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
