server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver — prevents stale IP cache when Render/Cloudflare rotates IPs
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    # Proxy all /api/* requests to the backend — same origin, no CORS, no cookie issues
    location /api/ {
        proxy_pass https://mpc-backend-latest.onrender.com;
        proxy_http_version 1.1;

        # Required for Cloudflare-fronted backends: sends SNI on the upstream TLS handshake
        proxy_ssl_server_name on;

        proxy_set_header Host mpc-backend-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies (both directions)
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;

        # Allow credentials (cookies) through
        proxy_pass_request_headers on;

        # API responses shouldn't be cached (esp. auth endpoints)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Security headers — must be repeated here, nginx does NOT inherit
        # add_header from the server block once a location sets its own
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # index.html should always be revalidated, not cached, so deploys show up immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Cache static assets (hashed filenames — safe to cache forever, unaffected by the no-cache rule above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        include /etc/nginx/conf.d/security-headers.conf;
    }
}